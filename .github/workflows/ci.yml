name: Build and verify
on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:
jobs:
  verify:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify backend with Docker MySQL
        run: mvn -B verify
        working-directory: backend
      - run: npm ci && npm run check && npm run test:pdf
        working-directory: frontend
  build-and-push:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      # backend / frontend 用 git tag 名作为镜像版本号（如 tag 1.0.1 → 镜像 :1.0.1）。
      # --provenance=false --sbom=false 必须关闭：ACR 不接受 attestation 空层。
      # MySQL/Redis 官方镜像已在服务器，无需推送。
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: backend/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: registry.cn-hangzhou.aliyuncs.com/node_caowj/backend:${{ github.ref_name }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: registry.cn-hangzhou.aliyuncs.com/node_caowj/frontend:${{ github.ref_name }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
  deploy:
    needs: build-and-push
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      # 服务器前置准备：git clone 仓库到 /opt/resume-craft、sh init-env.sh、
      # 将部署专用 SSH 公钥加入 authorized_keys；GitHub Secrets 需配
      # DEPLOY_HOST（服务器公网IP）、DEPLOY_USER、DEPLOY_SSH_KEY。
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/resume-craft
            git fetch origin
            git reset --hard origin/main
            docker compose -f compose.prod.yml up -d --wait
            docker compose -f compose.prod.yml ps
