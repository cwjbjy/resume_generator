name: Build and verify
on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:
jobs:
  verify:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify backend with Docker MySQL
        run: mvn -B verify
        working-directory: backend
      - run: npm ci && npm run check && npm run test:pdf
        working-directory: frontend
  build-and-push:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      # backend / frontend 用 git tag 名作为镜像版本号（如 tag 1.0.1 → 镜像 :1.0.1）。
      # --provenance=false --sbom=false 必须关闭：ACR 不接受 attestation 空层。
      # MySQL/Redis 官方镜像已在服务器，无需推送。
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: backend/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: registry.cn-hangzhou.aliyuncs.com/node_caowj/backend:${{ github.ref_name }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: registry.cn-hangzhou.aliyuncs.com/node_caowj/frontend:${{ github.ref_name }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
  deploy:
    needs: build-and-push
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      # 服务器前置准备：将 compose.prod.yml 上传到 /opt/resume-craft、
      # sh init-env.sh 生成 .env、将部署专用 SSH 公钥加入 authorized_keys；
      # GitHub Secrets 需配 DEPLOY_HOST（服务器公网IP）、DEPLOY_USER、DEPLOY_SSH_KEY。
      # 服务器不依赖 git：compose.prod.yml 变更时手动 scp 更新即可。
      # IMAGE_TAG 取自 git tag（如 1.0.1），compose.prod.yml 无需手动改版本号。
      - uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG
          script_stop: true
          script: |
            cd /opt/resume-craft
            pwd && ls -l compose.prod.yml
            IMAGE_TAG="$IMAGE_TAG" docker compose -f compose.prod.yml config | grep 'image:'
            IMAGE_TAG="$IMAGE_TAG" docker compose -f compose.prod.yml up -d --wait
            docker compose -f compose.prod.yml ps
            # 云盘空间有限：每个仓库仅保留当前版本与上一个版本镜像，更旧的删除
            for repo in backend frontend; do
              docker images --format '{{.Repository}}:{{.Tag}} {{.CreatedAt}}' \
                | grep "^registry.cn-hangzhou.aliyuncs.com/node_caowj/$repo:" \
                | grep -v ":$IMAGE_TAG " \
                | sort -k2,3 -r \
                | awk 'NR>1 {print $1}' \
                | xargs -r docker rmi 2>/dev/null || true
            done
            docker image prune -f >/dev/null 2>&1 || true
            docker images --format '{{.Repository}}:{{.Tag}}' | grep node_caowj | sort
