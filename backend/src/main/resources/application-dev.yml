spring:
  datasource:
    url: jdbc:h2:file:./data/resumecraft;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
  data:
    redis:
      repositories:
        enabled: false
app:
  demo-seed: true
  redis-enabled: false
  jwt-secret: ${JWT_SECRET:development-only-jwt-key-replace-before-production-2026}
  payment-secret: ${PAYMENT_SECRET:development-only-payment-key}
management:
  health:
    redis:
      enabled: false
