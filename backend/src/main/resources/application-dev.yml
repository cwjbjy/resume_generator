spring:
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:${DB_PORT:3306}/resumecraft?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:resumecraft}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2s
app:
  jwt-secret: ${JWT_SECRET:development-only-jwt-key-replace-before-production-2026}
  payment-secret: ${PAYMENT_SECRET:development-only-payment-key}
