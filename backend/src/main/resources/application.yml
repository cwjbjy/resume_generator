spring:
  profiles:
    default: dev
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  flyway:
    locations: classpath:db/migration/mysql
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
server:
  port: 8080
  error:
    include-message: never
app:
  jwt-secret: ${JWT_SECRET:}
  payment-secret: ${PAYMENT_SECRET:}
  jwt-hours: 2
  ai:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-flash}
    timeout-seconds: ${DEEPSEEK_TIMEOUT_SECONDS:60}
  security:
    login-limit:
      ip-max-attempts: 60
      ip-window-seconds: 60
      account-max-attempts: 10
      account-window-seconds: 300
      trusted-proxies: ${LOGIN_TRUSTED_PROXIES:}
management:
  endpoints:
    web:
      exposure:
        include: health
